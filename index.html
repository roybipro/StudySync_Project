<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section Start-->
    <div class="header">

        <!-- Logo text Code Start-->
        <header class="header_content">
            <a href="#logo" class="logo">
                <img src="./images/StudySyn.svg" alt="logo" class="logoIcon">
                <span class="logoText">StydySync</span>
            </a>
            <!-- Logo text code End -->

            <!-- Nav bar code Start -->
             <nav class="nav">
                <a href="#home" class="navLink">Home</a>
                <a href="#features" class="navLink">Features</a>
                <a href="#pricing" class="navLink">Pricing</a>
                <a href="#blog" class="navLink">Blog</a>
                <a href="#about" class="navLink">About</a>
             </nav>
             <!-- Nav bar code End -->

             <!-- Contact Us Button Code Start-->
              <a href="#contact" class="contactButton">
                Contact Us
              </a>
              <!-- Contact Us Button Code End -->

              <!-- Menu Button Code Start -->
              <button class="menuButton" type="button" title="Toggle menu">
                <img src="./images/Hamburger.svg" alt="menu" class="menuIcon">
              </button>
              <!-- Menu Button Code End -->
               
        </header>
    </div>
    <!-- Header Section End -->
</body>
</html>
